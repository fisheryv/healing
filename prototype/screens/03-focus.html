<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>希音 — 专注模式</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#F9F7F4;--surface:#FFFFFF;--surface-2:#F3F1EE;
  --fg:#1E2A3A;--muted:#6B7A8A;--subtle:#A0ABB5;--border:#E5E1D8;
  --accent:#5B9B85;--accent-l:#D4EBE3;--accent-d:#3D7A68;
  --canvas:#0D1218;
  --ff-serif:'Iowan Old Style',Georgia,'Times New Roman',serif;
  --ff-sans:-apple-system,'SF Pro Text',system-ui,sans-serif;
}
body{background:#111315;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:var(--ff-sans);}
.phone{width:390px;height:844px;background:var(--bg);border-radius:47px;position:relative;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px #2a2a2a;}
.dyn{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:100;}
.sb{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;z-index:50;pointer-events:none;}
.sb-t{font-size:15px;font-weight:600;color:var(--fg);letter-spacing:-.3px;}
.sb-i{display:flex;align-items:center;gap:6px;}
.content{position:absolute;top:59px;bottom:83px;left:0;right:0;overflow-y:auto;background:var(--bg);}
.content::-webkit-scrollbar{display:none;}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:83px;background:rgba(249,247,244,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:10px;z-index:50;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.tab-label{font-size:10px;color:var(--subtle);}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:var(--fg);border-radius:3px;opacity:.18;z-index:100;}

/* Nav */
.nav{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.nav-back{display:flex;align-items:center;gap:4px;font-size:16px;color:var(--accent);cursor:pointer;}
.nav-title{font-family:var(--ff-serif);font-size:17px;color:var(--fg);}
.nav-ph{width:60px;}

/* Time Picker */
.picker-section{padding:24px 0 20px;text-align:center;border-bottom:1px solid var(--border);margin:0 22px;}
.picker-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
.picker-wrap{position:relative;height:150px;overflow:hidden;cursor:pointer;}
.picker-track{position:absolute;left:0;right:0;top:0;transition:transform .2s;}
.picker-item{height:50px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-serif);}
.picker-item.center{font-size:40px;color:var(--fg);}
.picker-item.near{font-size:26px;color:var(--muted);opacity:.6;}
.picker-item.far{font-size:18px;color:var(--muted);opacity:.3;}
.picker-unit{font-size:16px;color:var(--muted);margin-left:4px;align-self:flex-end;margin-bottom:10px;}
.picker-line-top{position:absolute;top:50px;left:32px;right:32px;height:1px;background:var(--border);}
.picker-line-bot{position:absolute;top:100px;left:32px;right:32px;height:1px;background:var(--border);}

/* Music section */
.music-section{margin:20px 22px;}
.section-lbl{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.music-card{background:var(--surface);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.music-card:active{background:var(--surface-2);}
.music-left{display:flex;align-items:center;gap:12px;}
.music-cover{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#DDD8F5,#C8CCF0);}
.music-info{}
.music-name{font-family:var(--ff-serif);font-size:15px;color:var(--fg);margin-bottom:3px;}
.music-sub{font-size:12px;color:var(--muted);}
.music-arr{color:var(--subtle);}

/* Headphone tip */
.hp-tip{margin:16px 22px 0;display:flex;align-items:center;gap:6px;}
.hp-tip-text{font-size:12px;color:var(--subtle);font-style:italic;}

/* Start button */
.start-wrap{margin:24px 22px;}
.btn-start-focus{display:block;width:100%;height:56px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-size:17px;font-family:var(--ff-serif);cursor:pointer;letter-spacing:.5px;transition:background .2s;}
.btn-start-focus:active{background:var(--accent-d);}

/* Focus Canvas overlay */
.focus-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--canvas);display:none;z-index:200;}
.focus-overlay.active{display:flex;flex-direction:column;}
.canvas-wrap{flex:1;position:relative;overflow:hidden;}
.canvas-wrap canvas{position:absolute;top:0;left:0;}
.abandon-btn{position:absolute;top:70px;right:20px;font-size:13px;color:rgba(255,255,255,.35);cursor:pointer;z-index:10;letter-spacing:.3px;}
.hp-bottom{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.5px;font-style:italic;}
/* Abandon modal */
.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;z-index:300;align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border-radius:20px;padding:28px 24px;margin:0 30px;width:100%;}
.modal-title{font-family:var(--ff-serif);font-size:18px;color:var(--fg);margin-bottom:10px;}
.modal-body{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px;}
.modal-btns{display:flex;flex-direction:column;gap:10px;}
.btn-modal-p{height:48px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-family:var(--ff-sans);cursor:pointer;}
.btn-modal-s{height:48px;background:transparent;color:var(--danger);border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:var(--ff-sans);cursor:pointer;}
/* Countdown overlay */
.countdown-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--canvas);display:none;z-index:250;flex-direction:column;align-items:center;justify-content:center;}
.countdown-overlay.active{display:flex;}
.countdown-num{font-family:var(--ff-serif);font-size:120px;color:rgba(255,255,255,.7);line-height:1;animation:breathe 1s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.05);opacity:1;}}
</style>
</head>
<body>
<div class="phone">
  <div class="dyn"></div>
  <div class="sb" id="sb-light">
    <span class="sb-t">9:41</span>
    <div class="sb-i">
      <svg width="17" height="12" fill="none"><rect x="0" y="6" width="3" height="6" rx="1" fill="#1E2A3A"/><rect x="4.5" y="4" width="3" height="8" rx="1" fill="#1E2A3A"/><rect x="9" y="2" width="3" height="10" rx="1" fill="#1E2A3A"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1E2A3A"/></svg>
      <svg width="16" height="12" fill="none"><path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="#1E2A3A"/><path d="M2.5 6.5A7.7 7.7 0 018 4.3a7.7 7.7 0 015.5 2.2" stroke="#1E2A3A" stroke-width="1.5" stroke-linecap="round"/><path d="M0 4A11.5 11.5 0 018 .8 11.5 11.5 0 0116 4" stroke="#1E2A3A" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="25" height="12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="2.5" stroke="#1E2A3A" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#1E2A3A"/><path d="M23 4v4a2 2 0 000-4z" fill="#1E2A3A" fill-opacity=".4"/></svg>
    </div>
  </div>

  <!-- Config screen -->
  <div class="content" id="config-screen">
    <div class="nav">
      <div class="nav-back" onclick="window.location='02-home.html'">
        <svg width="10" height="17" fill="none"><path d="M8 2L2 8.5 8 15" stroke="#5B9B85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        返回
      </div>
      <div class="nav-title">专注配置</div>
      <div class="nav-ph"></div>
    </div>

    <!-- Time Picker -->
    <div class="picker-section">
      <div class="picker-label">专注时长</div>
      <div class="picker-wrap" id="picker">
        <div class="picker-line-top"></div>
        <div class="picker-line-bot"></div>
        <div class="picker-track" id="picker-track">
          <div class="picker-item far">15<span class="picker-unit">min</span></div>
          <div class="picker-item near">20<span class="picker-unit">min</span></div>
          <div class="picker-item center" id="selected-time">25<span class="picker-unit">min</span></div>
          <div class="picker-item near">30<span class="picker-unit">min</span></div>
          <div class="picker-item far">35<span class="picker-unit">min</span></div>
        </div>
      </div>
    </div>

    <!-- Music combo -->
    <div class="music-section">
      <div class="section-lbl">音乐组合</div>
      <div class="music-card">
        <div class="music-left">
          <div class="music-cover"></div>
          <div class="music-info">
            <div class="music-name">Lo-fi Rain</div>
            <div class="music-sub">雨声 · Alpha 波 · 85%</div>
          </div>
        </div>
        <div class="music-arr">
          <svg width="8" height="14" fill="none"><path d="M2 2l5 5-5 5" stroke="#A0ABB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>

    <!-- Headphone tip -->
    <div class="hp-tip">
      <svg width="16" height="12" fill="none"><path d="M1 7A7 7 0 0113.5 4M1 7v4a2 2 0 002 2M13.5 4v7a2 2 0 01-2 2" stroke="#A0ABB5" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="hp-tip-text">Best experienced with headphones</span>
    </div>

    <!-- Start button -->
    <div class="start-wrap">
      <button class="btn-start-focus" onclick="startCountdown()">开 始 专 注</button>
    </div>
  </div>

  <!-- Countdown overlay -->
  <div class="countdown-overlay" id="countdown">
    <div class="countdown-num" id="count-num">3</div>
  </div>

  <!-- Focus canvas overlay -->
  <div class="focus-overlay" id="focus-canvas-overlay">
    <div class="canvas-wrap">
      <canvas id="art-canvas" width="390" height="702"></canvas>
      <div class="abandon-btn" onclick="showAbandon()">放弃专注</div>
      <div class="hp-bottom">Best with Headphones</div>
    </div>
  </div>

  <!-- Abandon modal -->
  <div class="modal-overlay" id="abandon-modal">
    <div class="modal">
      <div class="modal-title">确认放弃此次专注？</div>
      <div class="modal-body">已绘制的图案将以「残卷」的形式保存到画廊。</div>
      <div class="modal-btns">
        <button class="btn-modal-p" onclick="closeAbandon()">继续专注</button>
        <button class="btn-modal-s" onclick="window.location='06-gallery.html'">放弃</button>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item" onclick="window.location='02-home.html'">
      <svg width="24" height="24" fill="none"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1H5a1 1 0 01-1-1V10.5z" stroke="#A0ABB5" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 22V12h6v10" stroke="#A0ABB5" stroke-width="1.5"/></svg>
      <span class="tab-label">首页</span>
    </div>
    <div class="tab-item" onclick="window.location='04-library.html'">
      <svg width="24" height="24" fill="none"><circle cx="12" cy="12" r="9" stroke="#A0ABB5" stroke-width="1.5"/><path d="M9 8v8M15 8v8M9 12h6" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="tab-label">曲库</span>
    </div>
    <div class="tab-item" onclick="window.location='05-mixer.html'">
      <svg width="24" height="24" fill="none"><path d="M4 6h3M4 12h7M4 18h12" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="6" r="2" stroke="#A0ABB5" stroke-width="1.5"/><circle cx="13" cy="12" r="2" stroke="#A0ABB5" stroke-width="1.5"/><circle cx="18" cy="18" r="2" stroke="#A0ABB5" stroke-width="1.5"/></svg>
      <span class="tab-label">调音台</span>
    </div>
    <div class="tab-item" onclick="window.location='06-gallery.html'">
      <svg width="24" height="24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="#A0ABB5" stroke-width="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="#A0ABB5" stroke-width="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="#A0ABB5" stroke-width="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="#A0ABB5" stroke-width="1.5"/></svg>
      <span class="tab-label">画廊</span>
    </div>
    <div class="tab-item" onclick="window.location='07-profile.html'">
      <svg width="24" height="24" fill="none"><circle cx="12" cy="8" r="4" stroke="#A0ABB5" stroke-width="1.5"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="tab-label">我的</span>
    </div>
  </div>
  <div class="hi"></div>
</div>

<script>
// Time picker interaction
const times=[10,15,20,25,30,35,40,45,50,55,60];
let selectedIdx=3;
const track=document.getElementById('picker-track');
let startY=0,isDragging=false,offsetY=0;
const ITEM_H=50;

function renderPicker(){
  track.innerHTML='';
  for(let i=Math.max(0,selectedIdx-2);i<=Math.min(times.length-1,selectedIdx+2);i++){
    const d=Math.abs(i-selectedIdx);
    const cls=d===0?'center':d===1?'near':'far';
    const el=document.createElement('div');
    el.className='picker-item '+cls;
    el.innerHTML=times[i]+'<span class="picker-unit">min</span>';
    track.appendChild(el);
  }
}
renderPicker();
document.getElementById('picker').addEventListener('touchstart',e=>{startY=e.touches[0].clientY;isDragging=true;});
document.getElementById('picker').addEventListener('touchmove',e=>{
  if(!isDragging)return;
  const dy=startY-e.touches[0].clientY;
  if(Math.abs(dy)>25){
    selectedIdx=Math.max(0,Math.min(times.length-1,selectedIdx+(dy>0?1:-1)));
    renderPicker();startY=e.touches[0].clientY;
  }
});
document.getElementById('picker').addEventListener('touchend',()=>{isDragging=false;});

// Countdown + canvas
let countN=3;
function startCountdown(){
  const cdo=document.getElementById('countdown');
  cdo.classList.add('active');
  countN=3;
  document.getElementById('count-num').textContent=3;
  const iv=setInterval(()=>{
    countN--;
    if(countN>0){document.getElementById('count-num').textContent=countN;}
    else{
      clearInterval(iv);cdo.classList.remove('active');
      startFocusCanvas();
    }
  },1000);
}
function startFocusCanvas(){
  document.getElementById('focus-canvas-overlay').classList.add('active');
  document.getElementById('sb-light').style.cssText='position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;z-index:260;pointer-events:none;';
  document.querySelectorAll('.sb-t,.sb-i svg rect,.sb-i svg path,.sb-i svg circle').forEach(el=>{
    if(el.classList.contains('sb-t'))el.style.color='rgba(255,255,255,.6)';
    else el.setAttribute('fill','rgba(255,255,255,.6)');
  });
  drawLissajous();
}
function drawLissajous(){
  const canvas=document.getElementById('art-canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=390;canvas.height=702;
  ctx.fillStyle='#0D1218';ctx.fillRect(0,0,390,702);
  const cx=195,cy=351,A=150,B=150,a=3,b=2,delta=Math.PI/4;
  const hue=Math.random()*360;
  let theta=0,prev=null,fade=[];
  const step=0.008;
  function frame(){
    if(theta>4*Math.PI)return;
    for(let s=0;s<3;s++){
      const x=cx+A*Math.sin(a*theta+delta);
      const y=cy+B*Math.sin(b*theta);
      const alpha=0.7-theta/(4*Math.PI)*0.2;
      ctx.beginPath();
      if(prev){ctx.moveTo(prev[0],prev[1]);ctx.lineTo(x,y);}
      ctx.strokeStyle=`hsla(${hue},40%,70%,${alpha})`;
      ctx.lineWidth=1.2;ctx.lineCap='round';ctx.stroke();
      // Glow dot
      ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue},60%,85%,0.9)`;ctx.fill();
      prev=[x,y];theta+=step;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function showAbandon(){document.getElementById('abandon-modal').classList.add('active');}
function closeAbandon(){document.getElementById('abandon-modal').classList.remove('active');}
</script>
</body>
</html>
