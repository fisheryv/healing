<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>希音 — 我的</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#F9F7F4;--surface:#FFFFFF;--surface-2:#F3F1EE;
  --fg:#1E2A3A;--muted:#6B7A8A;--subtle:#A0ABB5;--border:#E5E1D8;
  --accent:#5B9B85;--accent-l:#D4EBE3;
  --danger:#C0524A;
  --ff-serif:'Iowan Old Style',Georgia,'Times New Roman',serif;
  --ff-sans:-apple-system,'SF Pro Text',system-ui,sans-serif;
}
body{background:#111315;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:var(--ff-sans);}
.phone{width:390px;height:844px;background:var(--bg);border-radius:47px;position:relative;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px #2a2a2a;}
.dyn{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:100;}
.sb{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;z-index:50;pointer-events:none;}
.sb-t{font-size:15px;font-weight:600;color:var(--fg);letter-spacing:-.3px;}
.sb-i{display:flex;align-items:center;gap:6px;}
.content{position:absolute;top:59px;bottom:83px;left:0;right:0;overflow-y:auto;background:var(--bg);}
.content::-webkit-scrollbar{display:none;}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:83px;background:rgba(249,247,244,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:10px;z-index:50;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.tab-label{font-size:10px;color:var(--subtle);}
.tab-item.active .tab-label{color:var(--accent);}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:var(--fg);border-radius:3px;opacity:.18;z-index:100;}

/* Profile header */
.profile-header{padding:20px 22px 18px;display:flex;align-items:center;justify-content:space-between;}
.avatar-name-wrap{display:flex;align-items:center;gap:14px;}
.avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#C8E0D4,#D4EBE3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.profile-name{font-family:var(--ff-serif);font-size:19px;color:var(--fg);margin-bottom:3px;}
.profile-acct{font-size:12px;color:var(--muted);}
.edit-btn{padding:7px 14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:13px;color:var(--muted);cursor:pointer;}

/* Heatmap */
.heatmap-section{padding:0 22px 20px;}
.section-title{font-family:var(--ff-serif);font-size:16px;color:var(--fg);margin-bottom:12px;}
.heatmap{overflow-x:auto;}
.heatmap::-webkit-scrollbar{display:none;}
.heatmap-grid{display:flex;gap:3px;}
.heatmap-col{display:flex;flex-direction:column;gap:3px;}
.heatmap-cell{width:10px;height:10px;border-radius:2px;cursor:pointer;}
.heatmap-cell:hover{outline:1px solid var(--accent);}
.heatmap-months{display:flex;gap:0;margin-bottom:4px;padding-left:22px;}
.heatmap-month{font-size:9px;color:var(--subtle);width:52px;flex-shrink:0;}

/* Stats */
.stats-section{padding:0 22px 20px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border-radius:14px;padding:14px 16px;}
.stat-card.wide{grid-column:1/-1;}
.stat-val{font-family:var(--ff-serif);font-size:24px;color:var(--fg);margin-bottom:4px;}
.stat-label{font-size:12px;color:var(--muted);}
.stat-streak{display:flex;align-items:center;gap:6px;}
.streak-fire{font-size:18px;}

/* Settings */
.settings-section{padding:0 22px 24px;}
.settings-group{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:12px;}
.settings-group-title{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;padding:16px 16px 8px;}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.settings-item:last-child{border-bottom:none;}
.settings-item-label{font-size:15px;color:var(--fg);}
.settings-item-value{font-size:13px;color:var(--muted);}
.settings-arr{color:var(--subtle);}
/* Toggle switch */
.toggle{width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle-thumb{width:22px;height:22px;border-radius:11px;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-thumb{transform:translateX(18px);}
/* Logout */
.logout-btn{display:block;width:100%;padding:16px;background:var(--surface);border-radius:16px;border:none;font-size:16px;color:var(--danger);font-family:var(--ff-sans);cursor:pointer;text-align:center;}
</style>
</head>

<script>
// Generate heatmap for past 16 weeks (compact view)
function buildHeatmap(){
  const wrap=document.getElementById('heatmap-wrap');
  const levels=[[0,'#1C2128'],[1,'#033a16'],[2,'#196c2e'],[3,'#2ea043'],[4,'#56d364']];
  const today=new Date(2026,4,23); // May 23 2026
  const days=112; // 16 weeks
  const grid=document.createElement('div');
  grid.style.cssText='display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;';
  grid.style.scrollbarWidth='none';
  // columns = weeks
  for(let w=0;w<16;w++){
    const col=document.createElement('div');
    col.style.cssText='display:flex;flex-direction:column;gap:3px;';
    for(let d=0;d<7;d++){
      const dayIndex=w*7+d;
      const cell=document.createElement('div');
      // Random count weighted toward recent weeks
      let count=0;
      if(dayIndex<days){
        const r=Math.random();
        const recentBoost=dayIndex>90?0.3:0;
        if(r<0.35+recentBoost)count=0;
        else if(r<0.55+recentBoost)count=1;
        else if(r<0.72+recentBoost)count=2;
        else if(r<0.85+recentBoost)count=3;
        else count=4;
      }
      const color=levels[count][1];
      cell.style.cssText=`width:12px;height:12px;border-radius:2px;background:${color};cursor:pointer;flex-shrink:0;`;
      col.appendChild(cell);
    }
    grid.appendChild(col);
  }
  wrap.appendChild(grid);
  // Month labels
  const months=document.createElement('div');
  months.style.cssText='display:flex;gap:0;margin-top:4px;';
  ['2月','3月','4月','5月'].forEach((m,i)=>{
    const lbl=document.createElement('span');
    lbl.textContent=m;
    lbl.style.cssText='font-size:9px;color:#A0ABB5;width:52px;flex-shrink:0;letter-spacing:.3px;';
    months.appendChild(lbl);
  });
  wrap.appendChild(months);
}
buildHeatmap();
function confirmLogout(){
  if(confirm('确认退出登录？本地数据不会删除。'))window.location='01-login.html';
}
</script>
