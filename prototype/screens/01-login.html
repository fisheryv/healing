<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>希音 — 登录 / 注册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#F9F7F4;--surface:#FFFFFF;--surface-2:#F3F1EE;
  --fg:#1E2A3A;--muted:#6B7A8A;--subtle:#A0ABB5;--border:#E5E1D8;
  --accent:#5B9B85;--accent-l:#D4EBE3;--accent-d:#3D7A68;
  --danger:#C0524A;
  --ff-serif:'Iowan Old Style',Georgia,'Times New Roman',serif;
  --ff-sans:-apple-system,'SF Pro Text',system-ui,sans-serif;
}
body{background:#111315;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:var(--ff-sans);}
.phone{width:390px;height:844px;background:var(--bg);border-radius:47px;position:relative;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px #2a2a2a;}
.dyn{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:100;}
.sb{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;z-index:50;pointer-events:none;}
.sb-t{font-size:15px;font-weight:600;color:var(--fg);letter-spacing:-.3px;}
.sb-i{display:flex;align-items:center;gap:6px;}
.screen{position:absolute;top:59px;bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);}
.screen::-webkit-scrollbar{display:none;}

/* Login styles */
.logo-wrap{text-align:center;padding:48px 24px 36px;}
.logo-svg{width:64px;height:64px;margin:0 auto 14px;}
.logo-name{font-family:var(--ff-serif);font-size:26px;color:var(--fg);letter-spacing:.5px;}
.logo-sub{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:1.5px;text-transform:uppercase;}
.auth-tabs{display:flex;margin:0 24px;border-bottom:1px solid var(--border);margin-bottom:28px;}
.auth-tab{flex:1;text-align:center;padding:10px 0;font-family:var(--ff-serif);font-size:17px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s;}
.auth-tab.active{color:var(--fg);border-bottom-color:var(--accent);}
.form-wrap{padding:0 24px;}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:22px;}
.seg-t{flex:1;text-align:center;padding:7px 0;font-size:14px;color:var(--muted);border-radius:7px;cursor:pointer;transition:all .2s;}
.seg-t.active{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.fg{margin-bottom:18px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.8px;text-transform:uppercase;}
.fi-w{position:relative;display:flex;align-items:center;border-bottom:1px solid var(--border);transition:border-color .2s;}
.fi-w:focus-within{border-color:var(--accent);}
.fi{flex:1;height:46px;background:transparent;border:none;outline:none;font-size:16px;color:var(--fg);font-family:var(--ff-sans);padding:0;}
.fi::placeholder{color:var(--subtle);}
.fi-act{padding:8px 4px;font-size:13px;color:var(--accent);cursor:pointer;white-space:nowrap;font-weight:500;}
.fi-ico{color:var(--subtle);cursor:pointer;padding:8px;}
.cc{font-size:16px;color:var(--fg);padding-right:10px;border-right:1px solid var(--border);margin-right:10px;cursor:pointer;display:flex;align-items:center;gap:4px;}
.mode-toggle{text-align:right;margin-bottom:20px;}
.mode-toggle a{font-size:13px;color:var(--accent);text-decoration:none;}
.btn-p{display:block;width:100%;height:52px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:16px;font-family:var(--ff-serif);cursor:pointer;margin-top:24px;letter-spacing:.5px;transition:background .2s;}
.btn-p:active{background:var(--accent-d);}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0;}
.divider-l{flex:1;height:1px;background:var(--border);}
.divider-t{font-size:12px;color:var(--subtle);letter-spacing:.5px;white-space:nowrap;}
.social-btns{display:flex;flex-direction:column;gap:10px;}
.btn-s{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:15px;color:var(--fg);cursor:pointer;font-family:var(--ff-sans);}
.forgot{text-align:center;margin-top:16px;}
.forgot a{font-size:13px;color:var(--muted);text-decoration:none;}
.reg-form{display:none;}
</style>
</head>
<body>
<div class="phone">
  <div class="dyn"></div>
  <div class="sb">
    <span class="sb-t">9:41</span>
    <div class="sb-i">
      <svg width="17" height="12" fill="none"><rect x="0" y="6" width="3" height="6" rx="1" fill="#1E2A3A"/><rect x="4.5" y="4" width="3" height="8" rx="1" fill="#1E2A3A"/><rect x="9" y="2" width="3" height="10" rx="1" fill="#1E2A3A"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1E2A3A"/></svg>
      <svg width="16" height="12" fill="none"><path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="#1E2A3A"/><path d="M2.5 6.5A7.7 7.7 0 018 4.3a7.7 7.7 0 015.5 2.2" stroke="#1E2A3A" stroke-width="1.5" stroke-linecap="round"/><path d="M0 4A11.5 11.5 0 018 .8 11.5 11.5 0 0116 4" stroke="#1E2A3A" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="25" height="12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="2.5" stroke="#1E2A3A" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#1E2A3A"/><path d="M23 4v4a2 2 0 000-4z" fill="#1E2A3A" fill-opacity=".4"/></svg>
    </div>
  </div>

  <div class="screen" id="screen">
    <div class="logo-wrap">
      <svg class="logo-svg" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="30" stroke="#E5E1D8" stroke-width="1"/>
        <path d="M10 32 C10 16,28 8,32 20 C36 32,54 24,54 32 C54 48,36 56,32 44 C28 32,10 48,10 32Z" stroke="#5B9B85" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="32" r="3.5" fill="#5B9B85"/>
        <circle cx="18" cy="24" r="1.5" fill="#5B9B85" opacity=".4"/>
        <circle cx="46" cy="40" r="1.5" fill="#5B9B85" opacity=".4"/>
      </svg>
      <div class="logo-name">希音 Healing</div>
      <div class="logo-sub">专注，从一首音符开始</div>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="showLogin()">登录</div>
      <div class="auth-tab" id="tab-reg" onclick="showRegister()">注册</div>
    </div>

    <!-- Login Form -->
    <div class="form-wrap" id="login-form">
      <div class="seg">
        <div class="seg-t active" onclick="switchSeg(this)">手机号</div>
        <div class="seg-t" onclick="switchSeg(this)">邮箱</div>
      </div>
      <div class="fg">
        <label class="fl">账号</label>
        <div class="fi-w">
          <div class="cc"><span>+86</span><svg width="10" height="6" fill="none"><path d="M1 1l4 4 4-4" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/></svg></div>
          <input class="fi" type="tel" placeholder="请输入手机号">
        </div>
      </div>
      <div class="fg">
        <label class="fl">密码</label>
        <div class="fi-w">
          <input class="fi" type="password" placeholder="请输入密码">
          <div class="fi-ico"><svg width="20" height="14" fill="none"><path d="M1 7s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6z" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="7" r="2.5" stroke="#A0ABB5" stroke-width="1.5"/></svg></div>
        </div>
      </div>
      <div class="mode-toggle"><a href="#">切换为验证码登录</a></div>
      <button class="btn-p">登 录</button>
      <div class="forgot"><a href="#">忘记密码？</a></div>
      <div class="divider"><div class="divider-l"></div><span class="divider-t">其他方式登录</span><div class="divider-l"></div></div>
      <div class="social-btns">
        <button class="btn-s">
          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.4c-.2 1.2-.9 2.3-2 2.9v2.4h3.2c1.9-1.7 3-4.3 3-7.1z" fill="#4285F4"/><path d="M10 20c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.1H1.1v2.6C2.7 17.7 6.1 20 10 20z" fill="#34A853"/><path d="M4.4 11.9C4.2 11.3 4.1 10.7 4.1 10s.1-1.3.3-1.9V5.5H1.1A10 10 0 000 10c0 1.6.4 3.1 1.1 4.5l3.3-2.6z" fill="#FBBC05"/><path d="M10 3.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8C15 .9 12.7 0 10 0 6.1 0 2.7 2.3 1.1 5.5l3.3 2.6c.8-2.4 3-4.2 5.6-4.2z" fill="#EA4335"/></svg>
          使用 Google 账号登录
        </button>
        <button class="btn-s">
          <svg width="18" height="20" viewBox="0 0 18 20" fill="#1E2A3A"><path d="M14.9 10.6c0-3 2.5-4.4 2.6-4.5-1.4-2-3.6-2.3-4.4-2.3-1.9-.2-3.7 1.1-4.6 1.1-.9 0-2.4-1.1-4-1C2.3 4 .5 5.2-.5 7c2 4.3 1.1 7.1 2.2 8.6.5.7 1.2 1.6 2 1.5.8 0 1.1-.5 2.1-.5 1 0 1.3.5 2.1.5.9 0 1.5-.7 2-1.5.7-.9 1-1.8 1-1.8-.2-.1-2.1-1.1-2-3.2zm-2-5.8c.5-.5.8-1.2.7-1.9-.7.1-1.5.5-2 1-.5.5-.8 1.2-.7 1.9.7-.1 1.5-.5 2-1z"/></svg>
          使用 Apple ID 登录
        </button>
        <button class="btn-s">
          <svg width="22" height="18" viewBox="0 0 22 18" fill="none"><ellipse cx="8.5" cy="8" rx="7.5" ry="6" stroke="#07C160" stroke-width="1.5"/><circle cx="6" cy="8" r="1.2" fill="#07C160"/><circle cx="11" cy="8" r="1.2" fill="#07C160"/><path d="M14 10c1.2.8 3 .8 5 1.8l-1.5.5.2 1.8c-1.8.5-3.5.2-5-1z" stroke="#07C160" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
          使用微信登录
        </button>
      </div>
    </div>

    <!-- Register Form -->
    <div class="form-wrap reg-form" id="reg-form">
      <div class="seg">
        <div class="seg-t active" onclick="switchSeg(this)">手机号</div>
        <div class="seg-t" onclick="switchSeg(this)">邮箱</div>
      </div>
      <div class="fg">
        <label class="fl">手机号</label>
        <div class="fi-w">
          <div class="cc"><span>+86</span><svg width="10" height="6" fill="none"><path d="M1 1l4 4 4-4" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/></svg></div>
          <input class="fi" type="tel" placeholder="请输入手机号">
        </div>
      </div>
      <div class="fg">
        <label class="fl">验证码</label>
        <div class="fi-w">
          <input class="fi" type="text" placeholder="6 位数字验证码">
          <div class="fi-act" id="send-btn" onclick="startCountdown()">发送验证码</div>
        </div>
      </div>
      <div class="fg">
        <label class="fl">密码</label>
        <div class="fi-w">
          <input class="fi" type="password" placeholder="8–20 位，需含字母和数字">
          <div class="fi-ico"><svg width="20" height="14" fill="none"><path d="M1 7s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6z" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="7" r="2.5" stroke="#A0ABB5" stroke-width="1.5"/></svg></div>
        </div>
      </div>
      <div class="fg">
        <label class="fl">确认密码</label>
        <div class="fi-w">
          <input class="fi" type="password" placeholder="再次输入密码">
          <div class="fi-ico"><svg width="20" height="14" fill="none"><path d="M1 7s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6z" stroke="#A0ABB5" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="7" r="2.5" stroke="#A0ABB5" stroke-width="1.5"/></svg></div>
        </div>
      </div>
      <button class="btn-p">注 册</button>
    </div>
  </div>
</div>

<script>
function showLogin(){
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-reg').classList.remove('active');
  document.getElementById('login-form').style.display='block';
  document.getElementById('reg-form').style.display='none';
}
function showRegister(){
  document.getElementById('tab-reg').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  document.getElementById('reg-form').style.display='block';
  document.getElementById('login-form').style.display='none';
}
function switchSeg(el){
  el.parentElement.querySelectorAll('.seg-t').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
let timer=null;
function startCountdown(){
  if(timer)return;
  const btn=document.getElementById('send-btn');
  let t=60;
  btn.style.color='#A0ABB5';
  btn.textContent=t+'s';
  timer=setInterval(()=>{
    t--;btn.textContent=t+'s';
    if(t<=0){clearInterval(timer);timer=null;btn.style.color='#5B9B85';btn.textContent='重新发送';}
  },1000);
}
</script>
</body>
</html>
